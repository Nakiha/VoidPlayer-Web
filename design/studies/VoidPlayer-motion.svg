<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 1024 1024">
  <title>VoidPlayer</title>
  <rect width="1024" height="1024" rx="224" fill="#e5ebf3"/>
  <style>
@media (prefers-reduced-motion: no-preference) {
  #Frame-A { --dx: -55px; --dy: -44px; }
  #Frame-B { --dx: 55px; --dy: 44px; }
  #Frame-A, #Frame-B { animation: open-frame 2s cubic-bezier(.45,0,.2,1) infinite; }
  @keyframes open-frame {
    0%, 18%, 68%, 100% { transform: translate(0, 0); }
    42% { transform: translate(var(--dx), var(--dy)); }
  }
}
  </style>
  <g id="Frame-A"><path xmlns="http://www.w3.org/2000/svg" fill="#2460D6" d="M184 518 V483 C184 341 299 226 441 226 H727 Q744 226 733 240 L640 356 Q632 366 619 366 H455 C381 366 324 423 324 497 V551 Q324 562 317 571 L201 716 Q184 737 184 710 Z"/></g>
  <g id="Frame-B"><path xmlns="http://www.w3.org/2000/svg" transform="rotate(180 512 512)" fill="#2460D6" d="M184 518 V483 C184 341 299 226 441 226 H727 Q744 226 733 240 L640 356 Q632 366 619 366 H455 C381 366 324 423 324 497 V551 Q324 562 317 571 L201 716 Q184 737 184 710 Z"/></g>
</svg>
