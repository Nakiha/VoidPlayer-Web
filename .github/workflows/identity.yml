name: Verify intranet users
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/run-tests.mjs ci-identity-unit
      - run: npx playwright install --with-deps chromium
      - run: node scripts/run-tests.mjs --prepare
      - run: node scripts/run-tests.mjs ci-identity-browser --prepared
      - name: Verify ordinary HTTP without secure-context APIs
        run: node scripts/run-tests.mjs ci-identity-http --prepared
        env:
          VOIDPLAYER_HTTP_TEST: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-screenshots
          path: |
            /tmp/voidplayer-identity-*.png
            .run/test-suites/
          if-no-files-found: ignore
