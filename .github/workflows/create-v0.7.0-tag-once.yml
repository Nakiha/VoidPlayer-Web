name: Create authorized v0.7.0 tag once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/create-v0.7.0-tag-once.yml']
permissions:
  contents: write
  actions: read
jobs:
  create-exact-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = 'Nakiha', repo = 'VoidPlayer-Web';
            const sha = '5d724d41ccf5727b1e0651a336b0070754590da7', tag = 'v0.7.0';
            if (context.repo.owner !== owner || context.repo.repo !== repo || context.ref !== 'refs/heads/main') throw new Error('Unexpected repository or ref');
            const run = (await github.rest.actions.getWorkflowRun({owner, repo, run_id: 38000901376})).data;
            if (run.head_sha !== sha || run.status !== 'completed' || run.conclusion !== 'success') throw new Error('Exact release commit CI is not successful');
            const pkg = (await github.rest.repos.getContent({owner, repo, path: 'package.json', ref: sha})).data;
            if (JSON.parse(Buffer.from(pkg.content, 'base64').toString()).version !== '0.7.0') throw new Error('Wrong version');
            const notes = (await github.rest.repos.getContent({owner, repo, path: 'docs/releases/0.7.0.md', ref: sha})).data;
            if (!Buffer.from(notes.content, 'base64').toString().trim()) throw new Error('Missing release notes');
            const releases = await github.paginate(github.rest.repos.listReleases, {owner, repo, per_page: 100});
            if (releases.some(r => r.tag_name === tag)) throw new Error('Release already exists; refusing mutation');
            try {
              await github.rest.git.getRef({owner, repo, ref: 'tags/' + tag});
              throw new Error('Tag already exists; refusing mutation');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.git.createRef({owner, repo, ref: 'refs/tags/' + tag, sha});
            const ref = (await github.rest.git.getRef({owner, repo, ref: 'tags/' + tag})).data;
            if (ref.object.type !== 'commit' || ref.object.sha !== sha) throw new Error('Tag verification failed');
            core.summary.addHeading('Verified authorized release tag').addRaw(tag + ' → ' + sha).write();
