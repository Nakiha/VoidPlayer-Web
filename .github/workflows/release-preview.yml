name: Build and verify standalone releases

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

env:
  VOIDPLAYER_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

concurrency:
  group: standalone-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  identity:
    name: Verify release version and automation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - run: node scripts/release-version.mjs
      - run: node --test test/release-pipeline.test.mjs test/test-manifest.test.mjs

  decoder:
    name: Build pinned WASM decoder
    outputs:
      ffmpegRepository: ${{ steps.core.outputs.ffmpegRepository }}
      ffmpegRevision: ${{ steps.core.outputs.ffmpegRevision }}
    runs-on: ubuntu-24.04
    needs: identity
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Read decoder lock
        id: core
        run: |
          node --input-type=module -e '
          import { readFileSync, appendFileSync } from "node:fs";
          const lock = JSON.parse(readFileSync("scripts/release-core.json", "utf8"));
          for (const [key, value] of Object.entries(lock)) appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          '
      - name: Restore exact decoder build
        id: cache
        uses: actions/cache@v4
        with:
          path: public/vendor/voidplayer-core
          key: release-core-v1-${{ runner.os }}-${{ hashFiles('scripts/release-core.json', 'scripts/prepare-release-core.mjs') }}
      - name: Checkout decoder build source
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.core.outputs.repository }}
          ref: ${{ steps.core.outputs.revision }}
          path: .run/core-source
      - name: Checkout FFmpeg source
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.core.outputs.ffmpegRepository }}
          ref: ${{ steps.core.outputs.ffmpegRevision }}
          path: .run/core-source/.build/sources/ffmpeg-wasm
      - name: Checkout dav1d source
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.core.outputs.dav1dRepository }}
          ref: ${{ steps.core.outputs.dav1dRevision }}
          path: .run/core-source/.build/sources/dav1d-wasm
      - name: Setup Emscripten
        if: steps.cache.outputs.cache-hit != 'true'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ steps.core.outputs.emscripten }}
          actions-cache-folder: .run/emsdk-cache
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'
      - name: Install decoder build tools
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          MESON_VERSION: ${{ steps.core.outputs.meson }}
          NINJA_VERSION: ${{ steps.core.outputs.ninja }}
        run: python -m pip install "meson==$MESON_VERSION" "ninja==$NINJA_VERSION"
      - name: Build both decoder variants using upstream build script
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          FFMPEG_REF: ${{ steps.core.outputs.ffmpegRef }}
        run: |
          # Meson emits CommonJS probes with an .exe extension; do not inherit
          # the web application's package.json type=module in the build tree.
          printf '%s\n' '{"type":"commonjs"}' > .run/core-source/.build/package.json
          bash .run/core-source/scripts/build-wasm.sh --ffmpeg-ref "$FFMPEG_REF" --skip-package
          bash .run/core-source/scripts/build-wasm.sh --ffmpeg-ref "$FFMPEG_REF" --skip-package --mt
          node scripts/prepare-release-core.mjs .run/core-source
      - name: Verify decoder provenance and required interfaces
        run: node scripts/run-tests.mjs --case release-core
      - uses: actions/upload-artifact@v4
        with:
          name: release-core
          path: public/vendor/voidplayer-core/
          if-no-files-found: error
          retention-days: 14

  source-logic:
    name: Verify all source-only Node logic
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - run: node scripts/run-tests.mjs source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-logic-reports
          path: .run/test-suites/source/
          if-no-files-found: error

  analysis-logic:
    name: Verify analysis contracts (R1/R2/R3 unit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - name: Run analysis unit contracts
        run: node scripts/run-tests.mjs ci-analysis-logic

  analysis-browser:
    name: Verify analysis panel (${{ matrix.engine }})
    needs: decoder
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - name: Use primary Ubuntu package archive
        if: runner.os == 'Linux'
        run: bash scripts/testing/prepare-ci-apt.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: release-core
          path: public/vendor/voidplayer-core
      - run: npm ci
      - name: Checkout pinned codec QA samples
        uses: actions/checkout@v4
        with:
          repository: Nakiha/VoidPlayer
          ref: 881eb5ccd706c33aa1ff35ab3a67ac3a226ccfba
          path: .run/qa-samples
          sparse-checkout: resources/video
          lfs: true
      - run: bash scripts/sync-samples.sh .run/qa-samples/resources/video
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/run-tests.mjs --prepare
      - name: Verify analysis panel on ${{ matrix.engine }}
        run: node scripts/run-tests.mjs ci-analysis-browser --engine ${{ matrix.engine }} --prepared
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-browser-reports-${{ matrix.engine }}
          # B4：诊断与临时输入分离，脚本写入固定目录；失败现场保留，
          # 缺件时报错而不静默忽略。
          path: |
            .run/analysis-reports/${{ matrix.engine }}/
            .run/test-suites/ci-analysis-browser/
          if-no-files-found: error
          retention-days: 14

  paired-https:
    name: Compare trusted HTTPS performance against PR base
    if: github.event_name == 'pull_request'
    needs: decoder
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Use primary Ubuntu package archive
        if: runner.os == 'Linux'
        run: bash scripts/testing/prepare-ci-apt.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-core
          path: public/vendor/voidplayer-core
      - name: Checkout exact PR base in an isolated directory
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .run/i18n-https-baseline
      - name: Prepare identical media, dependencies and core
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3-tools
          npx playwright install --with-deps chromium
          node scripts/make-playback-fixtures.mjs
          baseline="$PWD/.run/i18n-https-baseline"
          if cmp -s package-lock.json "$baseline/package-lock.json"; then
            ln -s "$PWD/node_modules" "$baseline/node_modules"
          else
            (cd "$baseline" && npm ci)
          fi
          mkdir -p "$baseline/public/vendor" "$baseline/.run/playback-media"
          cp -R public/vendor/voidplayer-core "$baseline/public/vendor/voidplayer-core"
          cp .run/playback-media/*.mp4 "$baseline/.run/playback-media/"
          (cd "$baseline" && node scripts/run-tests.mjs --prepare)
          node scripts/run-tests.mjs --prepare
      - name: Original HTTPS thresholds, baseline-feature-feature-baseline
        id: paired-performance
        continue-on-error: true
        env:
          I18N_BASELINE_ROOT: ${{ github.workspace }}/.run/i18n-https-baseline
        run: node scripts/run-tests.mjs ci-perf-pair --prepared
      - name: Report informational benchmark failure explicitly
        if: always() && steps.paired-performance.outcome != 'success'
        run: |
          echo '::warning::Paired HTTPS benchmark did not pass. Read raw reports and configurationValid; do not infer real-time success from a green informational job.'
          echo 'Paired HTTPS benchmark did not pass. See paired-https-performance-reports for every sample and child exit status.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-https-performance-reports
          retention-days: 30
          path: |
            .run/test-suites/ci-perf-pair/
            .run/test-suites/build-receipt.json
            .run/i18n-https-baseline/.run/test-suites/build-receipt.json

  playback:
    name: Verify trusted HTTPS, WebCodecs and source UI
    needs: decoder
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Use primary Ubuntu package archive
        if: runner.os == 'Linux'
        run: bash scripts/testing/prepare-ci-apt.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: release-core
          path: public/vendor/voidplayer-core
      - run: npm ci
      - name: Checkout pinned codec QA samples
        uses: actions/checkout@v4
        with:
          repository: Nakiha/VoidPlayer
          ref: 881eb5ccd706c33aa1ff35ab3a67ac3a226ccfba
          path: .run/qa-samples
          sparse-checkout: resources/video
          lfs: true
      - run: bash scripts/sync-samples.sh .run/qa-samples/resources/video
      - name: Prepare complete unit-test fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3-tools
          npm run fixtures:flv
          npm run fixtures:hlg
          node scripts/sync-fate-samples.mjs
      - name: Restore pinned native raw-plane oracle
        id: oracle-cache
        uses: actions/cache@v4
        with:
          path: .run/native-oracle
          key: native-oracle-v1-${{ runner.os }}-${{ hashFiles('scripts/release-core.json', 'scripts/build-native-oracle.sh') }}
      - name: Checkout pinned native oracle source
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.decoder.outputs.ffmpegRepository }}
          ref: ${{ needs.decoder.outputs.ffmpegRevision }}
          path: .run/oracle-source
      - name: Build native reference decoder including VVC
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-native-oracle.sh .run/oracle-source .run/native-oracle
      - run: npx playwright install --with-deps chromium webkit
      - name: Build browser regression inputs
        id: browser-inputs
        run: node scripts/run-tests.mjs --prepare
      - run: node scripts/run-tests.mjs unit
        env:
          VOIDPLAYER_FFMPEG_ORACLE: ${{ github.workspace }}/.run/native-oracle/ffmpeg
      - name: Verify independent playback and source UI cases
        if: ${{ !cancelled() && steps.browser-inputs.outcome == 'success' }}
        run: node scripts/run-tests.mjs ci-playback --prepared
      - name: Preserve audio navigation and output evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunistic-audio-reports
          path: .run/opportunistic-audio/
          if-no-files-found: ignore
          retention-days: 30
      - name: Generate approximately 100 MB 1080p playback inputs
        id: playback-inputs
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3-tools
          node scripts/make-playback-fixtures.mjs
      - name: Verify annotation persistence and unified cache management
        if: ${{ !cancelled() && steps.browser-inputs.outcome == 'success' }}
        run: node scripts/run-tests.mjs ci-cache --prepared
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: annotation-cache-screenshots
          path: |
            /tmp/voidplayer-annotation-*.png
            /tmp/voidplayer-caches-*.png
          if-no-files-found: ignore
      - name: Test FLV native decode policy
        if: ${{ !cancelled() && steps.browser-inputs.outcome == 'success' }}
        env:
          FLV_CASE: standard-h264
        run: node scripts/run-tests.mjs ci-flv --prepared
      - name: Verify FLV startup in each engine independently
        if: ${{ !cancelled() && steps.browser-inputs.outcome == 'success' }}
        run: node scripts/run-tests.mjs flv-startup --prepared
      - name: Verify FATE frame contracts and metadata regressions
        timeout-minutes: 6
        if: ${{ !cancelled() && steps.browser-inputs.outcome == 'success' }}
        run: node scripts/run-tests.mjs ci-fate --prepared
      - name: Audit FATE transport-stream clock faults (exploratory report)
        timeout-minutes: 8
        run: |
          node scripts/make-timestamp-fixtures.mjs
          node scripts/check-timestamp-corpus.mjs --report-only
      - name: Test trusted HTTPS loading and repeated dual WebCodecs playback
        if: ${{ !cancelled() && steps.playback-inputs.outcome == 'success' }}
        run: node scripts/run-tests.mjs ci-https --prepared
        env:
          VOIDPLAYER_HTTPS_TEST: '1'
      - name: Report playback performance on this runner (non-blocking)
        id: benchmark
        if: success()
        continue-on-error: true
        run: node scripts/run-tests.mjs ci-perf --prepared
        env:
          VOIDPLAYER_HTTPS_TEST: '1'
      - name: Summarize playback benchmark
        if: ${{ !cancelled() && steps.benchmark.outcome == 'failure' }}
        run: |
          echo '::warning::Playback benchmark did not pass on this runner; see https-playback-reports. Functional checks remain required.'
          echo 'Playback benchmark: did not pass on this runner. See https-playback-reports for results and logs for execution errors. Performance is informational; functional checks still gate release aggregation.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: https-playback-reports
          path: |
            .run/playback-reports/
            .run/test-suites/
          if-no-files-found: ignore
          retention-days: 30

  uncovered-regressions:
    name: Verify browser regressions no other job runs
    needs: decoder
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - name: Use primary Ubuntu package archive
        if: runner.os == 'Linux'
        run: bash scripts/testing/prepare-ci-apt.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: release-core
          path: public/vendor/voidplayer-core
      - run: npm ci
      - name: Checkout pinned codec QA samples
        uses: actions/checkout@v4
        with:
          repository: Nakiha/VoidPlayer
          ref: 881eb5ccd706c33aa1ff35ab3a67ac3a226ccfba
          path: .run/qa-samples
          sparse-checkout: resources/video
          lfs: true
      - run: bash scripts/sync-samples.sh .run/qa-samples/resources/video
      - name: Prepare generated fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm run fixtures:flv
          npm run fixtures:hlg
          node scripts/sync-fate-samples.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/run-tests.mjs --prepare
      - name: Verify regressions that no other job runs
        # The runner records every exit status and fails only after all cases ran.
        run: node scripts/run-tests.mjs uncovered --prepared --engine ${{ matrix.engine }}
        env:
          # Only virtual headless Linux throughput/gaps are informational. Raw
          # negative verdicts remain in reports; all functional failures gate.
          VOIDPLAYER_FLV_VIRTUAL_PERF: report
      - name: Report virtual FLV playback timing
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { readdir, readFile, appendFile } from 'node:fs/promises';
          const directory = '.run/playback-reports/flv/${{ matrix.engine }}';
          const rows = [];
          for (const name of await readdir(directory).catch(() => [])) {
            const report = JSON.parse(await readFile(`${directory}/${name}`, 'utf8'));
            if (!report.benchmark.passed) rows.push(`- ${report.name}: **performance NOT PASSED**, speed ${report.benchmark.measurements?.speed}, failures ${report.benchmark.failures.join(', ')}`);
          }
          if (rows.length) await appendFile(process.env.GITHUB_STEP_SUMMARY, `### Virtual FLV performance\n${rows.join('\n')}\nNegative timing verdicts are retained in uncovered-browser-reports. Functional failures still block release.\n`);
          JS
      - name: Verify language switching and expanded layouts
        run: node scripts/run-tests.mjs ci-i18n --prepared --engine ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uncovered-browser-reports-${{ matrix.engine }}
          path: |
            .run/test-suites/uncovered/
            .run/test-suites/ci-i18n/
            .run/playback-reports/
          if-no-files-found: error
          retention-days: 30

  hevc-browser:
    name: Verify HEVC timeline (${{ matrix.engine }}, ${{ matrix.input }})
    needs: decoder
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        input: [local, remote]
    steps:
      - uses: actions/checkout@v4
      - name: Use primary Ubuntu package archive
        if: runner.os == 'Linux'
        run: bash scripts/testing/prepare-ci-apt.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: release-core
          path: public/vendor/voidplayer-core
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          repository: Nakiha/VoidPlayer
          ref: 881eb5ccd706c33aa1ff35ab3a67ac3a226ccfba
          path: .run/qa-samples
          sparse-checkout: resources/video
          lfs: true
      - run: bash scripts/sync-samples.sh .run/qa-samples/resources/video
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      # Preserve all eight full 600-frame sweeps (two reopen rounds per cell).
      - run: node scripts/run-tests.mjs --case hevc-timeline-${{ matrix.engine }}-${{ matrix.input }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hevc-timeline-${{ matrix.engine }}-${{ matrix.input }}
          path: |
            .run/playback-reports/hevc-timeline-browser.json
            .run/test-suites/selected/
          if-no-files-found: error

  native-release:
    name: Standalone ${{ matrix.platform }}
    needs: decoder
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux-x64 }
          - { os: windows-2022, platform: windows-x64 }
          - { os: macos-14, platform: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Use primary Ubuntu package archive
        if: runner.os == 'Linux'
        run: bash scripts/testing/prepare-ci-apt.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@v4
        with:
          name: release-core
          path: public/vendor/voidplayer-core
      - run: npm ci
      - run: node scripts/run-tests.mjs --case release-core
      - name: Verify configuration and persistent index on Node
        run: node scripts/run-tests.mjs ci-native-node
      - name: Verify persistent index on packaged runtime
        run: node scripts/run-tests.mjs ci-native-bun
      - run: node scripts/run-tests.mjs --prepare
      - run: node scripts/package-release.mjs --target bun-${{ matrix.platform }}
      - run: node scripts/run-tests.mjs --case release
      - name: Install network playback browser
        if: runner.os == 'Linux' || runner.os == 'Windows'
        run: npx playwright install --with-deps chromium
      - name: Install certificate test utility
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libnss3-tools
      - name: Verify ordinary HTTP connection guide
        if: runner.os == 'Linux'
        run: node scripts/run-tests.mjs ci-native-http --prepared
        env:
          VOIDPLAYER_HTTP_TEST: '1'
          VOIDPLAYER_HTTP_PLAYBACK: '1'
      - name: Verify trusted HTTPS and WebCodecs on client platforms
        timeout-minutes: 3
        if: runner.os == 'Linux' || runner.os == 'Windows'
        run: node scripts/run-tests.mjs ci-native-https --prepared
        env:
          VOIDPLAYER_HTTPS_TEST: '1'
          VOIDPLAYER_HTTP_PLAYBACK: '1'
      - name: Verify Windows console shutdown
        if: runner.os == 'Windows'
        run: node scripts/run-tests.mjs ci-native-console
      - uses: actions/upload-artifact@v4
        with:
          name: voidplayer-${{ matrix.platform }}
          path: artifacts/*.tar.gz*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-reports-${{ matrix.platform }}
          path: .run/test-suites/
          if-no-files-found: ignore
      - name: Write download summary
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "### $PLATFORM" >> "$GITHUB_STEP_SUMMARY"
          echo '构建与独立运行测试通过。请下载本次运行的同名 artifact，解压后核验 .sha256。' >> "$GITHUB_STEP_SUMMARY"
          echo '最终用户无需安装 Node/Bun。分支构建提供预览产物；版本标签在全平台验证通过后生成 Release 草稿。' >> "$GITHUB_STEP_SUMMARY"

  release-set:
    name: Verify complete platform release set
    needs: [native-release, playback, source-logic, analysis-logic, analysis-browser, hevc-browser, uncovered-regressions]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: voidplayer-*
          merge-multiple: true
          path: artifacts/release-set
      - run: node scripts/run-tests.mjs --case release-set
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-set
          path: artifacts/release-set/
          if-no-files-found: error
          retention-days: 30

  release-draft:
    name: Stage verified release draft
    if: github.ref_type == 'tag'
    needs: release-set
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-set
          path: artifacts/release-set
      - name: Reverify archives and stage unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/stage-release.mjs
