name: Verify hosted visual baseline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cores:
    uses: ./.github/workflows/prepare-cores.yml
  qa-media:
    uses: ./.github/workflows/prepare-qa-media.yml
  visual:
    needs: [cores, qa-media]
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Normalize default transparency preference on this disposable runner
        run: |
          defaults read com.apple.universalaccess reduceTransparency || true
          defaults write com.apple.universalaccess reduceTransparency -bool false
          defaults read com.apple.universalaccess reduceTransparency
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: release-core
          path: public/vendor/voidplayer-core
      - uses: actions/download-artifact@v8
        with:
          name: release-analysis-core
          path: public/vendor/voidplayer-analysis
      - uses: ./.github/actions/qa-media
      - run: brew install ffmpeg
      - run: npx playwright install chromium
      - name: Verify browser default before UI assertions
        run: |
          node --input-type=module <<'JS'
          import {chromium} from './scripts/testing/browser-engines.mjs';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          try{const page=await browser.newPage();const media=await page.evaluate(()=>({contrast:matchMedia('(prefers-contrast:more)').matches,transparency:matchMedia('(prefers-reduced-transparency:reduce)').matches}));console.log(media);assert.equal(media.contrast,false);assert.equal(media.transparency,false);}finally{await browser.close();}
          JS
      - run: node scripts/run-tests.mjs --case browser-theme-chromium --case browser-settings-chromium --case browser-menu-chromium --case browser-hlg-chromium
        env:
          VOIDPLAYER_FUNCTIONAL_ONLY: '1'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-baseline-reports
          path: |
            .run/test-suites/selected/
            .run/playback-reports/
