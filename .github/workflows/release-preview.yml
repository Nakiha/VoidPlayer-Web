name: Diagnose Linux playback screenshots
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cores:
    uses: ./.github/workflows/prepare-cores.yml
  qa-media:
    uses: ./.github/workflows/prepare-qa-media.yml
  probe:
    needs: [cores, qa-media]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mode: [cdp, headed]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: release-core
          path: public/vendor/voidplayer-core
      - uses: actions/download-artifact@v8
        with:
          name: release-analysis-core
          path: public/vendor/voidplayer-analysis
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: ./.github/actions/media-fixtures
        with:
          ffmpeg-repository: ${{ needs.cores.outputs.ffmpegRepository }}
          ffmpeg-revision: ${{ needs.cores.outputs.ffmpegRevision }}
      - run: npx playwright install --with-deps chromium
      - uses: ./.github/actions/browser-display
      - name: Write isolated launch adapter
        run: |
          mkdir -p .run
          cat > .run/gpu-capture-launch.mjs <<'JS'
          import {chromium} from 'playwright';
          const launch=chromium.launch.bind(chromium);
          chromium.launch=options=>{
            if(process.env.CAPTURE_MODE==='headed')options={...options,headless:false};
            if(process.env.CAPTURE_MODE==='no-surface')options={...options,args:[...(options.args??[]),'--disable-vulkan-surface']};
            if(process.env.CAPTURE_MODE==='cdp')options={...options,args:options.args.map(arg=>arg.startsWith('--enable-features=')?arg+',CDPScreenshotNewSurface':arg)};
            return launch(options);
          };
          JS
      - name: Run unchanged FLV overlay regression
        env:
          CAPTURE_MODE: ${{ matrix.mode }}
          DEBUG: pw:browser
        run: NODE_OPTIONS="--import=$PWD/.run/gpu-capture-launch.mjs" node scripts/run-tests.mjs --case browser-bitstream-analysis-flv-legacy-chromium
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capture-probe-${{ matrix.mode }}
          include-hidden-files: true
          path: |
            .run/test-suites/selected/
            .run/browser-fixtures/
            .run/analysis-reports/
  macos-reference:
    needs: cores
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: release-core
          path: public/vendor/voidplayer-core
      - uses: actions/download-artifact@v8
        with:
          name: release-analysis-core
          path: public/vendor/voidplayer-analysis
      - run: brew install ffmpeg
      - run: npx playwright install chromium
      - run: node scripts/run-tests.mjs --case browser-reference-flv-chromium --case browser-opportunistic-audio-chromium
        env:
          VOIDPLAYER_FUNCTIONAL_ONLY: '1'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-reference-diagnostics
          include-hidden-files: true
          path: .run/test-suites/selected/
