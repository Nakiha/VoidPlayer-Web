name: Verify HTTPS host and stable analysis targeting
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cores:
    uses: ./.github/workflows/prepare-cores.yml
  qa-media:
    uses: ./.github/workflows/prepare-qa-media.yml
  ts:
    needs: [cores, qa-media]
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: release-core
          path: public/vendor/voidplayer-core
      - uses: actions/download-artifact@v8
        with:
          name: release-analysis-core
          path: public/vendor/voidplayer-analysis
      - uses: ./.github/actions/qa-media
      - run: brew install ffmpeg
      - run: npx playwright install chromium webkit
      - uses: ./.github/actions/browser-display
      - run: node scripts/run-tests.mjs --case browser-analysis-chromium
        env:
          VOIDPLAYER_FUNCTIONAL_ONLY: '1'
      - run: node scripts/run-tests.mjs --case browser-analysis-webkit --prepared
        env:
          VOIDPLAYER_FUNCTIONAL_ONLY: '1'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: analysis-isolated-reports
          path: |
            .run/test-suites/selected/
            artifacts/source-activity/
            .run/analysis-reports/

  https-playback:
    name: Verify trusted HTTPS and repeated dual WebCodecs playback
    needs: cores
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Use primary Ubuntu package archive
        run: bash scripts/testing/prepare-ci-apt.sh
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: release-core
          path: public/vendor/voidplayer-core
      - uses: actions/download-artifact@v8
        with:
          name: release-analysis-core
          path: public/vendor/voidplayer-analysis
      - run: npm ci
      - name: Install generated-media and certificate tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3-tools
      - run: npx playwright install --with-deps chromium
      - uses: ./.github/actions/browser-display
      - run: node scripts/run-tests.mjs --prepare
      - name: Generate approximately 100 MB 1080p playback inputs
        run: node scripts/make-playback-fixtures.mjs
      - name: Test trusted HTTPS loading and repeated dual WebCodecs playback
        run: node scripts/run-tests.mjs ci-https --prepared
        env:
          VOIDPLAYER_HTTPS_TEST: '1'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: https-playback-reports
          path: |
            .run/playback-reports/
            .run/test-suites/ci-https/
          if-no-files-found: ignore
          retention-days: 30

