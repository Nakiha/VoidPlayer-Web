name: Verify isolated WebKit TS native seek
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cores:
    uses: ./.github/workflows/prepare-cores.yml
  qa-media:
    uses: ./.github/workflows/prepare-qa-media.yml
  ts:
    needs: [cores, qa-media]
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: release-core
          path: public/vendor/voidplayer-core
      - uses: actions/download-artifact@v8
        with:
          name: release-analysis-core
          path: public/vendor/voidplayer-analysis
      - uses: ./.github/actions/qa-media
      - run: brew install ffmpeg
      - run: npx playwright install webkit
      - uses: ./.github/actions/browser-display
      - run: node scripts/run-tests.mjs --case browser-bitstream-ts-webkit --directory .run/test-suites/ts-first
        env:
          VOIDPLAYER_FUNCTIONAL_ONLY: '1'
      - run: node scripts/run-tests.mjs --case browser-bitstream-ts-webkit --prepared --directory .run/test-suites/ts-second
        env:
          VOIDPLAYER_FUNCTIONAL_ONLY: '1'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ts-isolated-reports
          path: |
            .run/test-suites/ts-first/
            .run/test-suites/ts-second/
            .run/analysis-reports/
