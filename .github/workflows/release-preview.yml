name: Verify hosted native presentation repairs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cores:
    uses: ./.github/workflows/prepare-cores.yml
  qa-media:
    uses: ./.github/workflows/prepare-qa-media.yml
  macos:
    needs: [cores, qa-media]
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: release-core
          path: public/vendor/voidplayer-core
      - uses: actions/download-artifact@v8
        with:
          name: release-analysis-core
          path: public/vendor/voidplayer-analysis
      - uses: ./.github/actions/qa-media
      - run: brew install ffmpeg
      - run: npx playwright install chromium webkit
      - run: node scripts/run-tests.mjs --case browser-reference-flv-chromium --case browser-opportunistic-audio-chromium --case hevc-timeline-webkit-local
        env:
          VOIDPLAYER_FUNCTIONAL_ONLY: '1'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-macos-diagnostics
          path: |
            .run/test-suites/selected/
            .run/playback-reports/
  windows:
    needs: cores
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: release-core
          path: public/vendor/voidplayer-core
      - uses: actions/download-artifact@v8
        with:
          name: release-analysis-core
          path: public/vendor/voidplayer-analysis
      - run: npx playwright install chromium
      - run: node scripts/run-tests.mjs --case identity-https
        env:
          VOIDPLAYER_HTTPS_TEST: '1'
          VOIDPLAYER_HTTP_PLAYBACK: '1'
          DEBUG: pw:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-windows-diagnostics
          path: |
            .run/test-suites/selected/
            .run/playback-reports/
