name: Diagnose Linux playback screenshots
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cores:
    uses: ./.github/workflows/prepare-cores.yml
  probe:
    needs: cores
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mode: [stock, no-surface, cdp, headed]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: release-core
          path: public/vendor/voidplayer-core
      - uses: actions/download-artifact@v8
        with:
          name: release-analysis-core
          path: public/vendor/voidplayer-analysis
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium
      - uses: ./.github/actions/browser-display
      - name: Write isolated launch adapter
        run: |
          mkdir -p .run
          cat > .run/gpu-capture-launch.mjs <<'JS'
          import {chromium} from 'playwright';
          const launch=chromium.launch.bind(chromium);
          chromium.launch=options=>{
            if(process.env.CAPTURE_MODE==='headed')options={...options,headless:false};
            if(process.env.CAPTURE_MODE==='no-surface')options={...options,args:[...(options.args??[]),'--disable-vulkan-surface']};
            if(process.env.CAPTURE_MODE==='cdp')options={...options,args:options.args.map(arg=>arg.startsWith('--enable-features=')?arg+',CDPScreenshotNewSurface':arg)};
            return launch(options);
          };
          JS
      - name: Run unchanged Agent annotation regression
        env:
          CAPTURE_MODE: ${{ matrix.mode }}
          DEBUG: pw:browser
        run: NODE_OPTIONS="--import=$PWD/.run/gpu-capture-launch.mjs" node scripts/run-tests.mjs --case browser-agent-annotations-chromium
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capture-probe-${{ matrix.mode }}
          include-hidden-files: true
          path: |
            .run/test-suites/selected/
            .run/agent-annotations/
