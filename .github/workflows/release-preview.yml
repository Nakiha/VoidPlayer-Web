name: Build and verify standalone releases

on:
  pull_request:
  push:
    branches: [main, codex/simplify-intranet-identity, codex/render-and-https-guide, codex/frame-contract-refactor, codex/annotation-persistence]
    tags: ['v*']
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

env:
  VOIDPLAYER_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

concurrency:
  group: standalone-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  identity:
    name: Verify release version and automation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - run: node scripts/release-version.mjs
      - run: node --test test/release-pipeline.test.mjs

  decoder:
    name: Build pinned WASM decoder
    outputs:
      ffmpegRepository: ${{ steps.core.outputs.ffmpegRepository }}
      ffmpegRevision: ${{ steps.core.outputs.ffmpegRevision }}
    runs-on: ubuntu-24.04
    needs: identity
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Read decoder lock
        id: core
        run: |
          node --input-type=module -e '
          import { readFileSync, appendFileSync } from "node:fs";
          const lock = JSON.parse(readFileSync("scripts/release-core.json", "utf8"));
          for (const [key, value] of Object.entries(lock)) appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          '
      - name: Restore exact decoder build
        id: cache
        uses: actions/cache@v4
        with:
          path: public/vendor/voidplayer-core
          key: release-core-v1-${{ runner.os }}-${{ hashFiles('scripts/release-core.json', 'scripts/prepare-release-core.mjs') }}
      - name: Checkout decoder build source
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.core.outputs.repository }}
          ref: ${{ steps.core.outputs.revision }}
          path: .run/core-source
      - name: Checkout FFmpeg source
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.core.outputs.ffmpegRepository }}
          ref: ${{ steps.core.outputs.ffmpegRevision }}
          path: .run/core-source/.build/sources/ffmpeg-wasm
      - name: Checkout dav1d source
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.core.outputs.dav1dRepository }}
          ref: ${{ steps.core.outputs.dav1dRevision }}
          path: .run/core-source/.build/sources/dav1d-wasm
      - name: Setup Emscripten
        if: steps.cache.outputs.cache-hit != 'true'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ steps.core.outputs.emscripten }}
          actions-cache-folder: .run/emsdk-cache
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'
      - name: Install decoder build tools
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          MESON_VERSION: ${{ steps.core.outputs.meson }}
          NINJA_VERSION: ${{ steps.core.outputs.ninja }}
        run: python -m pip install "meson==$MESON_VERSION" "ninja==$NINJA_VERSION"
      - name: Build both decoder variants using upstream build script
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          FFMPEG_REF: ${{ steps.core.outputs.ffmpegRef }}
        run: |
          # Meson emits CommonJS probes with an .exe extension; do not inherit
          # the web application's package.json type=module in the build tree.
          printf '%s\n' '{"type":"commonjs"}' > .run/core-source/.build/package.json
          bash .run/core-source/scripts/build-wasm.sh --ffmpeg-ref "$FFMPEG_REF" --skip-package
          bash .run/core-source/scripts/build-wasm.sh --ffmpeg-ref "$FFMPEG_REF" --skip-package --mt
          node scripts/prepare-release-core.mjs .run/core-source
      - name: Verify decoder provenance and required interfaces
        run: node scripts/check-release-core.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-core
          path: public/vendor/voidplayer-core/
          if-no-files-found: error
          retention-days: 14

  analysis-logic:
    name: Verify analysis contracts (R1/R2/R3 unit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - name: Run analysis unit contracts
        run: node --experimental-strip-types --test test/analysis-*.test.ts
      - name: Run session analysis projection contracts
        # 选择集回归 analysis-selection 与会话投影共用同一入口，显式列出，
        # 不只依赖上面的 glob（B4）。
        run: node --experimental-strip-types --test test/session.test.ts test/media-loading.test.ts test/analysis-selection.test.ts

  analysis-browser:
    name: Verify analysis panel (${{ matrix.engine }})
    needs: decoder
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: release-core
          path: public/vendor/voidplayer-core
      - run: npm ci
      - name: Checkout pinned codec QA samples
        uses: actions/checkout@v4
        with:
          repository: Nakiha/VoidPlayer
          ref: 881eb5ccd706c33aa1ff35ab3a67ac3a226ccfba
          path: .run/qa-samples
          sparse-checkout: resources/video
          lfs: true
      - run: bash scripts/sync-samples.sh .run/qa-samples/resources/video
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Verify analysis panel on ${{ matrix.engine }}
        run: node scripts/check-analysis-browser.mjs ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-browser-reports-${{ matrix.engine }}
          # B4：诊断与临时输入分离，脚本写入固定目录；失败现场保留，
          # 缺件时报错而不静默忽略。
          path: .run/analysis-reports/${{ matrix.engine }}/
          if-no-files-found: error
          retention-days: 14

  playback:
    name: Verify trusted HTTPS, WebCodecs and source UI
    needs: decoder
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: release-core
          path: public/vendor/voidplayer-core
      - run: npm ci
      - name: Checkout pinned codec QA samples
        uses: actions/checkout@v4
        with:
          repository: Nakiha/VoidPlayer
          ref: 881eb5ccd706c33aa1ff35ab3a67ac3a226ccfba
          path: .run/qa-samples
          sparse-checkout: resources/video
          lfs: true
      - run: bash scripts/sync-samples.sh .run/qa-samples/resources/video
      - name: Prepare complete unit-test fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3-tools
          npm run fixtures:flv
          node scripts/sync-fate-samples.mjs
      - name: Restore pinned native raw-plane oracle
        id: oracle-cache
        uses: actions/cache@v4
        with:
          path: .run/native-oracle
          key: native-oracle-v1-${{ runner.os }}-${{ hashFiles('scripts/release-core.json', 'scripts/build-native-oracle.sh') }}
      - name: Checkout pinned native oracle source
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.decoder.outputs.ffmpegRepository }}
          ref: ${{ needs.decoder.outputs.ffmpegRevision }}
          path: .run/oracle-source
      - name: Build native reference decoder including VVC
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-native-oracle.sh .run/oracle-source .run/native-oracle
      - run: npm test
        env:
          VOIDPLAYER_FFMPEG_ORACLE: ${{ github.workspace }}/.run/native-oracle/ffmpeg
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - run: npm run test:recovery:browser -- chromium
      - run: node scripts/check-recovery-browser.mjs webkit
      - run: node scripts/check-reference-flv-browser.mjs chromium
      - run: node scripts/check-reference-flv-browser.mjs webkit
      - name: Verify thumbnails, startup and restored workspace lifecycle
        run: |
          node scripts/check-thumbnail-browser.mjs webkit
          node scripts/check-thumbnail-browser.mjs chromium
          node scripts/check-thumbnail-worker.mjs
          node scripts/check-startup-browser.mjs
          node scripts/check-workspace-browser.mjs webkit
          node scripts/check-workspace-browser.mjs chromium

      - run: node scripts/check-presentation-browser.mjs
      - run: node scripts/check-feedback-browser.mjs chromium
      - run: node scripts/check-connection-guide-browser.mjs
      - name: Verify HTTP and HTTPS entry policy
        run: |
          node --test test/protocol-server.test.ts test/connection-routing.test.ts test/connection-guide.test.ts
          node scripts/check-http-entry-browser.mjs chromium
          node scripts/check-http-entry-browser.mjs webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: http-entry-screenshots
          path: /tmp/voidplayer-http-*.png
          if-no-files-found: ignore
      - name: Verify report descriptions and explicit log submission
        run: |
          node --test test/log.test.ts test/server.test.ts
          node scripts/check-log-report-browser.mjs webkit
          node scripts/check-log-report-browser.mjs chromium
      - name: Verify annotation strip and cross-track editing
        run: |
          node scripts/check-mark-cards-browser.mjs webkit
          node scripts/check-mark-cards-browser.mjs chromium
      - name: Generate approximately 100 MB 1080p playback inputs
        id: playback-inputs
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3-tools
          node scripts/make-playback-fixtures.mjs
      - name: Verify annotation persistence and unified cache management
        run: |
          node --test test/annotations-store.test.ts test/frame-index-cache.test.ts test/frame-index-worker.test.ts test/resource-budget.test.ts test/workspace-storage.test.ts
          node scripts/check-annotation-persistence-browser.mjs webkit
          node scripts/check-annotation-persistence-browser.mjs chromium
          node scripts/check-cache-browser.mjs webkit
          node scripts/check-cache-browser.mjs chromium
          node scripts/check-sharing-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: annotation-cache-screenshots
          path: |
            /tmp/voidplayer-annotation-*.png
            /tmp/voidplayer-caches-*.png
          if-no-files-found: ignore
      - name: Test FLV native decode policy
        env:
          FLV_CASE: standard-h264
        run: |
          npm run fixtures:flv
          node scripts/check-flv-browser.mjs webkit
          node scripts/check-range-browser.mjs webkit
          node scripts/check-range-browser.mjs chromium
          node --test test/flv-background.test.ts test/flv-open-gop.test.ts test/range-bridge-large.test.ts test/mp4-boundary.test.ts
          node --test test/flv-resolution.test.ts test/hevc-geometry.test.ts test/preroll.test.ts
          node scripts/check-flv-startup-browser.mjs chromium
          node scripts/check-flv-startup-browser.mjs webkit
      - name: Verify FATE frame contracts and metadata regressions
        timeout-minutes: 6
        run: |
          node scripts/sync-fate-samples.mjs
          node --test test/fate-oracle.test.ts test/frame-description.test.ts test/avc-geometry.test.ts test/packet-timeline.test.ts test/media-state.test.ts
          node scripts/check-fate.mjs
          node scripts/check-fate-browser.mjs
      - name: Audit FATE transport-stream clock faults (exploratory report)
        timeout-minutes: 8
        run: |
          node scripts/make-timestamp-fixtures.mjs
          node scripts/check-timestamp-corpus.mjs --report-only
      - name: Test trusted HTTPS loading and repeated dual WebCodecs playback
        if: ${{ !cancelled() && steps.playback-inputs.outcome == 'success' }}
        run: node scripts/check-http-playback.mjs --functional-only
        env:
          VOIDPLAYER_HTTPS_TEST: '1'
      - name: Report playback performance on this runner (non-blocking)
        id: benchmark
        if: success()
        continue-on-error: true
        run: node scripts/check-http-playback.mjs --benchmark-only
        env:
          VOIDPLAYER_HTTPS_TEST: '1'
      - name: Summarize playback benchmark
        if: ${{ !cancelled() && steps.benchmark.outcome == 'failure' }}
        run: |
          echo '::warning::Playback benchmark did not pass on this runner; see https-playback-reports. Functional checks remain required.'
          echo 'Playback benchmark: did not pass on this runner. See https-playback-reports for results and logs for execution errors. Performance is informational; functional checks still gate release aggregation.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: https-playback-reports
          path: .run/playback-reports/
          if-no-files-found: ignore
          retention-days: 30

  hevc-browser:
    name: Verify HEVC timeline (${{ matrix.engine }}, ${{ matrix.input }})
    needs: decoder
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        input: [local, remote]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: release-core
          path: public/vendor/voidplayer-core
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          repository: Nakiha/VoidPlayer
          ref: 881eb5ccd706c33aa1ff35ab3a67ac3a226ccfba
          path: .run/qa-samples
          sparse-checkout: resources/video
          lfs: true
      - run: bash scripts/sync-samples.sh .run/qa-samples/resources/video
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      # Preserve all eight full 600-frame sweeps (two reopen rounds per cell).
      - run: node scripts/check-hevc-timeline-browser.mjs ${{ matrix.engine }} ${{ matrix.input }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hevc-timeline-${{ matrix.engine }}-${{ matrix.input }}
          path: .run/playback-reports/hevc-timeline-browser.json
          if-no-files-found: error

  native-release:
    name: Standalone ${{ matrix.platform }}
    needs: decoder
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux-x64 }
          - { os: windows-2022, platform: windows-x64 }
          - { os: macos-14, platform: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@v4
        with:
          name: release-core
          path: public/vendor/voidplayer-core
      - run: npm ci
      - run: node scripts/check-release-core.mjs
      - name: Verify configuration and persistent index on Node
        run: node --test test/tls.test.ts test/decoder-policy.test.ts test/identity.test.ts test/config.test.ts test/library-index.test.ts test/library-incremental.test.ts test/library-storage.test.ts test/media-reference.test.ts test/admin.test.ts test/measurement.test.ts test/saved-workspaces.test.ts test/frame-index-cache.test.ts
      - name: Verify persistent index on packaged runtime
        run: bun test --timeout 60000 ./test/identity.test.ts ./test/library-index.test.ts ./test/library-incremental.test.ts ./test/library-storage.test.ts ./test/admin.test.ts ./test/measurement.test.ts ./test/saved-workspaces.test.ts ./test/frame-index-cache.test.ts
      - run: npm run release -- --target bun-${{ matrix.platform }}
      - run: npm run test:release
      - name: Install network playback browser
        if: runner.os == 'Linux' || runner.os == 'Windows'
        run: npx playwright install --with-deps chromium
      - name: Install certificate test utility
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libnss3-tools
      - name: Verify ordinary HTTP connection guide
        if: runner.os == 'Linux'
        run: node scripts/check-identity-browser.mjs
        env:
          VOIDPLAYER_HTTP_TEST: '1'
          VOIDPLAYER_HTTP_PLAYBACK: '1'
      - name: Verify trusted HTTPS and WebCodecs on client platforms
        timeout-minutes: 3
        if: runner.os == 'Linux' || runner.os == 'Windows'
        run: node scripts/check-identity-browser.mjs
        env:
          VOIDPLAYER_HTTPS_TEST: '1'
          VOIDPLAYER_HTTP_PLAYBACK: '1'
      - name: Verify Windows console shutdown
        if: runner.os == 'Windows'
        run: python scripts/check-windows-console.py
      - uses: actions/upload-artifact@v4
        with:
          name: voidplayer-${{ matrix.platform }}
          path: artifacts/*.tar.gz*
          if-no-files-found: error
          retention-days: 30
      - name: Write download summary
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "### $PLATFORM" >> "$GITHUB_STEP_SUMMARY"
          echo '构建与独立运行测试通过。请下载本次运行的同名 artifact，解压后核验 .sha256。' >> "$GITHUB_STEP_SUMMARY"
          echo '最终用户无需安装 Node/Bun。分支构建提供预览产物；版本标签在全平台验证通过后生成 Release 草稿。' >> "$GITHUB_STEP_SUMMARY"

  release-set:
    name: Verify complete platform release set
    needs: [native-release, playback, analysis-logic, analysis-browser, hevc-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: voidplayer-*
          merge-multiple: true
          path: artifacts/release-set
      - run: node scripts/check-release-set.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-set
          path: artifacts/release-set/
          if-no-files-found: error
          retention-days: 30

  release-draft:
    name: Stage verified release draft
    if: github.ref_type == 'tag'
    needs: release-set
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-set
          path: artifacts/release-set
      - name: Reverify archives and stage unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/stage-release.mjs
