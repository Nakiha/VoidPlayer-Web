name: voidplayer
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      VOIDPLAYER_PROXY_TOKEN: ${VOIDPLAYER_PROXY_TOKEN:?Set a gateway token in .env}
      VOIDPLAYER_ADMIN_USERS: ${VOIDPLAYER_ADMIN_USERS:-}
    volumes:
      - app-data:/data
      - type: bind
        source: ${VOIDPLAYER_MEDIA_DIR:?Set the media folder in .env}
        target: /media
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  gateway:
    image: caddy:2.11.4
    restart: unless-stopped
    environment:
      VOIDPLAYER_SITE: ${VOIDPLAYER_SITE:?Set the HTTPS hostname in .env}
      VOIDPLAYER_PROXY_TOKEN: ${VOIDPLAYER_PROXY_TOKEN:?Set a gateway token in .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - type: bind
        source: ./users.caddy
        target: /etc/caddy/users.caddy
        read_only: true
        bind:
          create_host_path: false
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  app-data:
  caddy-data:
  caddy-config:
